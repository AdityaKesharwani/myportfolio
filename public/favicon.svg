<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="akBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Border Cyan Gradient -->
    <linearGradient id="akBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.85"/>
    </linearGradient>

    <!-- A Gradient (Pure White to Silver) -->
    <linearGradient id="akLetterA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- K Gradient (Vibrant Cyan) -->
    <linearGradient id="akLetterK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="akCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#akBgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="url(#akBorderGrad)" stroke-width="10"/>

  <!-- Subtle Circuit / Grid Accent Lines -->
  <path d="M50 160 H100 L120 180" stroke="rgba(34, 211, 238, 0.15)" stroke-width="3" fill="none"/>
  <path d="M462 352 H412 L392 332" stroke="rgba(34, 211, 238, 0.15)" stroke-width="3" fill="none"/>

  <!-- Letter A (White / Silver Monogram) -->
  <path d="M85 390 L170 130 H225 L310 390 H255 L235 325 H160 L140 390 Z M172 280 H223 L197.5 195 Z" fill="url(#akLetterA)"/>

  <!-- Letter K (Electric Cyan with Glow) -->
  <g filter="url(#akCyanGlow)">
    <!-- Vertical Stem -->
    <path d="M315 130 H360 V390 H315 Z" fill="url(#akLetterK)"/>
    <!-- Upper Diagonal -->
    <path d="M345 275 L420 130 H475 L380 290 Z" fill="url(#akLetterK)"/>
    <!-- Lower Diagonal -->
    <path d="M360 260 L480 390 H420 L330 295 Z" fill="url(#akLetterK)"/>
  </g>

  <!-- Glowing Digital Status Pulse Indicator (Top Right) -->
  <circle cx="440" cy="90" r="22" fill="rgba(34, 211, 238, 0.25)" filter="url(#akCyanGlow)"/>
  <circle cx="440" cy="90" r="14" fill="#22d3ee" filter="url(#akCyanGlow)"/>
  <circle cx="440" cy="90" r="7" fill="#ffffff"/>
</svg>